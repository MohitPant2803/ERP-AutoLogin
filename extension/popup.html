<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IIT KGP ERP 1-Click Login</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="popup-header">
      <div class="brand">
        <img src="icons/icon48.png" alt="IIT KGP" class="brand-logo" />
        <div>
          <h1 class="brand-title">ERP 1-Click Login</h1>
          <span class="brand-subtitle">IIT Kharagpur</span>
        </div>
      </div>
      <div class="session-badge" id="session-badge">
        <span class="status-dot" id="status-dot"></span>
        <span id="session-status-text">Checking...</span>
      </div>
    </header>

    <!-- Gmail Status Bar -->
    <div id="google-quick-indicator" style="display: flex; align-items: center; justify-content: space-between; font-size: 11px; background: rgba(56, 189, 248, 0.08); padding: 5px 10px; border-radius: 6px; border: 1px solid rgba(56, 189, 248, 0.2);">
      <span style="display: inline-flex; align-items: center; gap: 5px;">
        <svg class="icon-svg" viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2" fill="none"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
        <span>Gmail Auto-Fetch:</span>
      </span>
      <span id="google-status-pill" style="color: #38bdf8; font-weight: 600;">Active (Ready)</span>
    </div>

    <!-- Main 1-Click Login Action Card -->
    <section class="card action-card">
      <button id="btn-one-click-login" class="btn btn-primary btn-large">
        <span class="btn-icon">
          <svg class="icon-svg" viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
        </span>
        <span id="login-btn-text">1-Click Login to ERP</span>
      </button>

      <!-- Live Progress & Status -->
      <div id="login-progress-container" class="progress-box hidden">
        <div class="spinner"></div>
        <div class="progress-text-col">
          <div id="progress-step-title" class="progress-title">Connecting to ERP...</div>
          <div id="progress-step-desc" class="progress-desc">Checking session</div>
        </div>
      </div>

      <!-- Quick OTP Input (Shown when waiting for OTP - masked as password) -->
      <div id="quick-otp-container" class="quick-otp-box hidden">
        <div class="otp-header">
          <span style="display: inline-flex; align-items: center; gap: 5px;">
            <svg class="icon-svg" viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2" fill="none"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <span>Enter OTP:</span>
          </span>
          <span id="otp-timer" class="otp-timer">60s</span>
        </div>
        <div class="otp-input-row">
          <input type="password" id="popup-otp-input" maxlength="6" placeholder="••••••" autocomplete="one-time-code" />
          <button id="btn-paste-otp" class="btn btn-secondary btn-sm" type="button" title="Paste from clipboard">
            <svg class="icon-svg" viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2" fill="none"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            <span>Paste</span>
          </button>
        </div>
        <button id="btn-submit-otp" class="btn btn-primary btn-full mt-2" type="button">
          <svg class="icon-svg" viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          <span>Instant Submit</span>
        </button>
        <div class="otp-hint">Listening to incoming email automatically...</div>
      </div>
    </section>

    <!-- Credentials Card -->
    <section class="card credentials-card">
      <div class="card-header-toggle" id="credentials-toggle">
        <div class="card-title">
          <span style="display: inline-flex; align-items: center; gap: 6px;">
            <svg class="icon-svg" viewBox="0 0 24 24" width="15" height="15" stroke="currentColor" stroke-width="2" fill="none"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <span>Saved Credentials</span>
          </span>
          <span id="creds-saved-badge" class="badge badge-success hidden">Ready</span>
        </div>
        <span id="creds-chevron" class="chevron">
          <svg class="icon-svg" viewBox="0 0 24 24" width="12" height="12" stroke="currentColor" stroke-width="2.5" fill="none"><polyline points="6 9 12 15 18 9"/></svg>
        </span>
      </div>

      <div id="credentials-form-body" class="credentials-body">
        <div class="form-group">
          <label for="input-roll">Roll Number</label>
          <div class="input-with-action">
            <input type="text" id="input-roll" placeholder="e.g. 21CS10001" autocomplete="username" />
            <button id="btn-fetch-questions" class="btn btn-secondary btn-xs" title="Auto-fetch questions from ERP">
              <svg class="icon-svg" viewBox="0 0 24 24" width="11" height="11" stroke="currentColor" stroke-width="2" fill="none"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
              <span>Fetch Qs</span>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label for="input-password">ERP Password</label>
          <input type="password" id="input-password" placeholder="••••••••" autocomplete="current-password" />
        </div>

        <!-- Security Questions & Answers -->
        <div class="security-questions-container">
          <div class="section-label">
            <span>Security Questions & Answers (3)</span>
          </div>

          <div class="qa-item">
            <input type="text" class="qa-question" id="input-q1" placeholder="Question 1" />
            <input type="password" class="qa-answer" id="input-a1" placeholder="Answer 1" />
          </div>

          <div class="qa-item">
            <input type="text" class="qa-question" id="input-q2" placeholder="Question 2" />
            <input type="password" class="qa-answer" id="input-a2" placeholder="Answer 2" />
          </div>

          <div class="qa-item">
            <input type="text" class="qa-question" id="input-q3" placeholder="Question 3" />
            <input type="password" class="qa-answer" id="input-a3" placeholder="Answer 3" />
          </div>
        </div>

        <div class="toggle-row">
          <label class="switch">
            <input type="checkbox" id="toggle-auto-login" checked />
            <span class="slider"></span>
          </label>
          <span class="toggle-label">Auto-login when visiting ERP page</span>
        </div>

        <div class="btn-row">
          <button id="btn-save-creds" class="btn btn-success btn-full">
            <svg class="icon-svg" viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
            <span>Save Credentials</span>
          </button>
        </div>
      </div>
    </section>

    <!-- Quick Actions Footer -->
    <footer class="popup-footer">
      <button id="btn-open-erp" class="footer-btn" title="Open ERP Portal">
        <svg class="icon-svg" viewBox="0 0 24 24" width="15" height="15" stroke="currentColor" stroke-width="2" fill="none"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
        <span>Open ERP</span>
      </button>
      <button id="btn-clear-sessions" class="footer-btn" title="Fix 'previous session active' error">
        <svg class="icon-svg" viewBox="0 0 24 24" width="15" height="15" stroke="currentColor" stroke-width="2" fill="none"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        <span>Clear Sessions</span>
      </button>
      <button id="btn-logout" class="footer-btn" title="Log out of ERP">
        <svg class="icon-svg" viewBox="0 0 24 24" width="15" height="15" stroke="currentColor" stroke-width="2" fill="none"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        <span>Log Out</span>
      </button>
      <button id="btn-open-options" class="footer-btn" title="Advanced Settings">
        <svg class="icon-svg" viewBox="0 0 24 24" width="15" height="15" stroke="currentColor" stroke-width="2" fill="none"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span>Settings</span>
      </button>
    </footer>
  </div>

  <script src="crypto-util.js"></script>
  <script src="erp-api.js"></script>
  <script src="gmail-otp.js"></script>
  <script src="popup.js"></script>
</body>
</html>
